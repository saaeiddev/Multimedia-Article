<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطالعه آنلاین کتاب | چندرسانه‌ای</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#596570;color:#18212b;font-family:Vazirmatn,"Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:10;min-height:58px;display:flex;align-items:center;gap:12px;padding:9px 16px;background:#f8fbffef;border-bottom:1px solid #ccd8e5;backdrop-filter:blur(22px)}.win{width:34px;height:34px;border:0;border-radius:9px;background:#087bd7;display:grid;place-items:center;cursor:pointer}.win svg{width:19px}.title{font-size:14px;font-weight:700}.tools{margin-right:auto;display:flex;align-items:center;gap:7px}.tools button{font:inherit;border:1px solid #ccd6df;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.info{font-size:12px;min-width:105px;text-align:center;color:#53616f}.viewer{min-height:calc(100vh - 58px);padding:22px 8px 90px;display:flex;flex-direction:column;align-items:center;gap:18px}.page{display:block;width:min(935px,100%);height:auto;background:#fff;box-shadow:0 8px 30px #0006;user-select:none;-webkit-user-drag:none}.loading{color:#fff;text-align:center;padding:90px 20px;line-height:2}@media(max-width:600px){.bar{flex-wrap:wrap;padding:8px}.title{font-size:13px}.tools{width:100%;margin-right:0;justify-content:center}.tools button{padding:7px 8px}.info{min-width:92px}.viewer{padding:8px 2px 70px;gap:8px}.page{width:100%}}
</style></head><body><header class="bar"><button class="win" onclick="location.href='index.html'" aria-label="خانه"><svg viewBox="0 0 24 24" fill="white"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button><span class="title">مطالعه آنلاین کتاب «چندرسانه‌ای»</span><div class="tools"><button id="prev">صفحه قبل</button><span class="info" id="info">در حال آماده‌سازی…</span><button id="next">صفحه بعد</button><button id="minus">−</button><button id="plus">+</button><button id="fit">عرض صفحه</button></div></header><main class="viewer" id="viewer"><div class="loading" id="loading">در حال آماده‌سازی صفحات کتاب…</div></main><script>const viewer=document.getElementById('viewer'),info=document.getElementById('info'),TOTAL=140;let current=1,scale=1;for(let i=1;i<=TOTAL;i++){const img=document.createElement('img');img.className='page';img.id='page-'+i;img.alt='صفحه '+i+' از کتاب چندرسانه‌ای';img.loading=i<3?'eager':'lazy';img.decoding='async';img.draggable=false;img.src=`book-pages/page-${String(i).padStart(3,'0')}.jpg`;viewer.appendChild(img)}document.getElementById('loading').remove();function go(n){current=Math.max(1,Math.min(TOTAL,n));document.getElementById('page-'+current)?.scrollIntoView({behavior:'smooth',block:'start'});info.textContent=`صفحه ${current} از ${TOTAL}`}function zoom(d){scale=Math.max(.65,Math.min(2,scale+d));document.querySelectorAll('.page').forEach(p=>p.style.width=scale===1?'min(935px,100%)':`min(${935*scale}px,${100*scale}%)`)}function fit(){scale=1;document.querySelectorAll('.page').forEach(p=>p.style.width='min(935px,100%)')}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('plus').onclick=()=>zoom(.15);document.getElementById('minus').onclick=()=>zoom(-.15);document.getElementById('fit').onclick=fit;addEventListener('scroll',()=>{const a=[...document.querySelectorAll('.page')];let b=1,d=1e9;a.forEach((p,i)=>{const x=Math.abs(p.getBoundingClientRect().top-innerHeight*.25);if(x<d){d=x;b=i+1}});current=b;info.textContent=`صفحه ${current} از ${TOTAL}`},{passive:true});info.textContent=`صفحه 1 از ${TOTAL}`;</script></body></html>
