<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطالعه آنلاین | چندرسانه‌ای</title><meta name="description" content="مطالعه آنلاین کتاب چندرسانه‌ای"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:#eef5fb;color:#17202a}.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#ffffffdd;backdrop-filter:blur(22px);border-bottom:1px solid #d8e3ed}.title{font-weight:700}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cbd7e2;background:#fff;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}.btn:hover{background:#f2f8fd}.viewer{background:#4f5963;min-height:calc(100vh - 64px);padding:24px 10px 70px;display:flex;flex-direction:column;align-items:center;gap:18px;overflow-x:auto}.page{display:block;background:#fff;box-shadow:0 8px 28px #0005;max-width:none}.loading{color:#fff;text-align:center;padding:90px 20px;line-height:2}@media(max-width:650px){.bar{align-items:flex-start;flex-direction:column}.tools{width:100%}.btn{flex:1}.viewer{padding:10px 3px;gap:10px}}</style></head><body><header class="bar"><div class="title">مطالعه آنلاین کتاب «چندرسانه‌ای»</div><div class="tools"><button class="btn" id="prev">صفحه قبل</button><span id="info">در حال بارگذاری...</span><button class="btn" id="next">صفحه بعد</button><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomIn">+</button><button class="btn" id="fit">عرض صفحه</button><button class="btn" onclick="document.documentElement.requestFullscreen?.()">تمام‌صفحه</button></div></header><main class="viewer" id="viewer"><div class="loading" id="loading">در حال بارگذاری کتاب…<br><small>تمام صفحات به‌صورت پیوسته نمایش داده می‌شوند.</small></div></main><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const url='multimedia%20farsi%20-%20%D9%88%DB%8C%D8%B1%D8%A7%D8%B3%D8%AA%D8%A7%D8%B1%DB%8C%20%D8%B9%D9%84%D9%85%DB%8C.pdf';const viewer=document.getElementById('viewer'),loading=document.getElementById('loading'),info=document.getElementById('info');let pdf,current=1,scale=1;async function start(){try{pdf=await pdfjsLib.getDocument({url,disableAutoFetch:false,disableStream:false}).promise;loading.remove();for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n),v=p.getViewport({scale:1}),c=document.createElement('canvas');c.className='page';c.id='page-'+n;c.dataset.w=v.width;c.width=v.width;c.height=v.height;viewer.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}update();window.addEventListener('scroll',track,{passive:true})}catch(e){loading.innerHTML='کتاب بارگذاری نشد.<br><small>صفحه را تازه‌سازی کنید.</small>';console.error(e)}}function go(n){current=Math.max(1,Math.min(pdf.numPages,n));document.getElementById('page-'+current)?.scrollIntoView({behavior:'smooth',block:'start'});update()}function update(){info.textContent='صفحه '+current+' از '+pdf.numPages}function track(){const ps=[...document.querySelectorAll('.page')],mid=innerHeight/2;let b=current,d=1e9;ps.forEach((p,i)=>{const x=Math.abs(p.getBoundingClientRect().top-mid);if(x<d){d=x;b=i+1}});current=b;update()}function zoom(d){scale=Math.max(.6,Math.min(2,scale+d));document.querySelectorAll('.page').forEach(c=>c.style.width=(c.dataset.w*scale)+'px')}function fit(){const w=Math.min(900,viewer.clientWidth-6);document.querySelectorAll('.page').forEach(c=>c.style.width=Math.min(w,+c.dataset.w)+'px');scale=1}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('zoomIn').onclick=()=>zoom(.15);document.getElementById('zoomOut').onclick=()=>zoom(-.15);document.getElementById('fit').onclick=fit;start();</script></body></html>
