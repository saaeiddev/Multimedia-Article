<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مطالعه آنلاین | چندرسانه‌ای</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#eef5fc;font-family:Segoe UI,Tahoma,sans-serif}
    body{height:100vh;overflow:hidden}
    .bar{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#f8fbff;border-bottom:1px solid #ccd8e5}
    .win{width:34px;height:34px;border:0;border-radius:9px;background:#087bd7;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
    .win svg{width:19px}
    .title{font-size:14px;font-weight:700}
    .hint{margin-right:auto;font-size:12px;color:#667580}

    .stage{
      height:calc(100vh - 58px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px 3vw 34px;
      overflow:hidden;
      perspective:1600px;
      background:
        radial-gradient(circle at 50% 18%,rgba(255,255,255,.95),rgba(255,255,255,.42) 30%,transparent 58%),
        linear-gradient(180deg,#eef5fc 0%,#dfeaf5 100%);
    }
    .laptop{
      width:min(92vw,1240px);
      transform-style:preserve-3d;
      filter:drop-shadow(0 28px 30px rgba(41,61,82,.22));
    }
    .display-shell{
      position:relative;
      width:100%;
      height:min(72vh,760px);
      min-height:360px;
      padding:14px 14px 16px;
      border-radius:20px 20px 10px 10px;
      background:linear-gradient(145deg,#30363d 0%,#0e1217 48%,#282e35 100%);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 -1px 0 rgba(0,0,0,.65),
        0 12px 28px rgba(23,40,58,.18);
      transform:rotateX(-1.8deg);
      transform-origin:50% 100%;
      transform-style:preserve-3d;
    }
    .camera{
      position:absolute;
      top:5px;
      left:50%;
      width:5px;
      height:5px;
      transform:translateX(-50%);
      border-radius:50%;
      background:#0a0d11;
      box-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 0 2px rgba(62,146,255,.5);
      z-index:3;
    }
    .screen{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      border-radius:8px;
      background:#596570;
      box-shadow:0 0 0 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .frame{width:100%;height:100%;border:0;display:block;background:#596570}
    .win11-taskbar{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:42px;
      z-index:6;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:0 10px;
      direction:ltr;
      background:linear-gradient(180deg,rgba(248,251,255,.66),rgba(229,237,247,.58));
      border-top:1px solid rgba(255,255,255,.76);
      box-shadow:0 -1px 14px rgba(44,63,82,.12),inset 0 1px 0 rgba(255,255,255,.42);
      backdrop-filter:blur(22px) saturate(165%);
      -webkit-backdrop-filter:blur(22px) saturate(165%);
      pointer-events:none;
    }
    .taskbar-icons{
      grid-column:2;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
    }
    .taskbar-icon{
      width:31px;
      height:31px;
      border-radius:8px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.13);
      filter:drop-shadow(0 1px 1px rgba(37,55,73,.16));
    }
    .taskbar-icon svg{width:21px;height:21px;display:block}
    .taskbar-icon.browser svg{width:23px;height:23px}
    .taskbar-icon.folder svg{width:23px;height:23px}
    .taskbar-tray{
      grid-column:3;
      justify-self:end;
      display:flex;
      align-items:center;
      gap:8px;
      color:#1e2832;
      font-family:Segoe UI,Tahoma,sans-serif;
      font-size:9px;
      line-height:1.05;
      text-align:right;
      white-space:nowrap;
    }
    .tray-icons{display:flex;align-items:center;gap:4px}
    .tray-icons svg{width:13px;height:13px;display:block}
    .taskbar-clock{min-width:34px}
    .hinge{
      position:relative;
      width:88%;
      height:10px;
      margin:-3px auto 0;
      border-radius:0 0 10px 10px;
      background:linear-gradient(180deg,#151a20,#555d66 44%,#15191e 100%);
      box-shadow:0 3px 5px rgba(0,0,0,.25);
      z-index:2;
    }
    .base{
      position:relative;
      width:106%;
      height:54px;
      margin:-2px -3% 0;
      transform-origin:50% 0;
      transform:rotateX(67deg) translateZ(-2px);
      border-radius:5px 5px 18px 18px;
      background:linear-gradient(180deg,#d8dee5 0%,#aeb7c0 48%,#7f8994 100%);
      border:1px solid rgba(84,96,108,.55);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 12px 20px rgba(47,65,84,.2);
    }
    .base:before{
      content:"";
      position:absolute;
      inset:7px 5.5% 15px;
      border-radius:5px;
      background:
        repeating-linear-gradient(90deg,rgba(76,87,98,.13) 0 3.2%,transparent 3.2% 4.2%),
        linear-gradient(180deg,rgba(255,255,255,.24),rgba(95,108,121,.08));
      border:1px solid rgba(92,104,116,.18);
    }
    .base:after{
      content:"";
      position:absolute;
      left:50%;
      bottom:4px;
      width:18%;
      height:7px;
      transform:translateX(-50%);
      border-radius:0 0 10px 10px;
      background:rgba(93,104,115,.34);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.4);
    }

    @media(max-width:700px){
      .hint{display:none}
      .stage{padding:14px 2vw 24px}
      .laptop{width:96vw}
      .display-shell{height:calc(100vh - 122px);min-height:300px;padding:10px 10px 12px;border-radius:14px 14px 7px 7px;transform:rotateX(-1deg)}
      .camera{top:3px;width:4px;height:4px}
      .win11-taskbar{height:34px;padding:0 6px}
      .taskbar-icons{gap:3px}
      .taskbar-icon{width:26px;height:26px;border-radius:6px}
      .taskbar-icon svg,.taskbar-icon.browser svg,.taskbar-icon.folder svg{width:18px;height:18px}
      .taskbar-tray{gap:4px;font-size:7px}
      .tray-icons svg{width:10px;height:10px}
      .base{height:34px}
      .hinge{height:7px}
    }
  </style>
</head>
<body>
  <header class="bar">
    <button class="win" onclick="location.href='index.html'" aria-label="بازگشت به خانه">
      <svg viewBox="0 0 24 24" fill="white"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>
    </button>
    <span class="title">مطالعه آنلاین کتاب «چندرسانه‌ای»</span>
    <span class="hint">نسخه کامل کتاب</span>
  </header>

  <main class="stage">
    <div class="laptop" aria-label="نمایش کتاب روی لپ‌تاپ سه‌بعدی">
      <div class="display-shell">
        <span class="camera" aria-hidden="true"></span>
        <div class="screen">
          <iframe class="frame" src="https://docs.google.com/gview?embedded=true&url=https%3A%2F%2Fsaaeiddev.github.io%2FMultimedia-Article%2Fmultimedia%2520farsi%2520-%2520%25D9%2588%25DB%258C%25D8%25B1%25D8%25A7%25D8%25B3%25D8%25AA%25D8%25A7%25D8%25B1%DB%8C%2520%25D8%25B9%25D9%2584%25D9%2585%DB%8C.pdf" title="کتاب چندرسانه‌ای"></iframe>
          <div class="win11-taskbar" aria-hidden="true">
            <div></div>
            <div class="taskbar-icons">
              <span class="taskbar-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#087cd5" d="M2.8 3.2 10.7 2v8.9H2.8zm9.1-1.4L21.2.5v10.4h-9.3zM2.8 12.1h7.9V21l-7.9-1.1zm9.1 0h9.3v10.4l-9.3-1.3z"/></svg>
              </span>
              <span class="taskbar-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="#313943" stroke-width="2.2"/><path d="m15.1 15.1 5 5" stroke="#313943" stroke-width="2.2" stroke-linecap="round"/></svg>
              </span>
              <span class="taskbar-icon folder">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f2bf39" d="M2.4 5.4c0-1 .8-1.8 1.8-1.8h5l2 2.3h8.6c1 0 1.8.8 1.8 1.8v9.7c0 1-.8 1.8-1.8 1.8H4.2c-1 0-1.8-.8-1.8-1.8z"/><path fill="#ffd65a" d="M2.4 8.1h19.2l-2 10.9H4.2c-1.1 0-1.9-1-1.7-2.1z"/></svg>
              </span>
              <span class="taskbar-icon browser">
                <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="edgeBlue" x1="3" y1="20" x2="20" y2="5"><stop stop-color="#0aa0f6"/><stop offset="1" stop-color="#0878d7"/></linearGradient></defs><path fill="url(#edgeBlue)" d="M21.2 13.6c-.8 4.7-4.9 8.1-9.6 8.1-5.3 0-9.6-4.2-9.6-9.4 0-4.8 3.7-8.8 8.5-9.3 3.8-.4 7.4 1.5 9.3 4.8-2.1-1.5-5.2-1.6-7.4-.1-2 1.4-2.8 4-1.9 6.1 1.2 2.8 4.6 4 7.3 2.7 1.5-.7 2.6-1.7 3.4-2.9z"/><path fill="#18c6ab" d="M4.2 9.2c1.7-3 5.2-4.5 8.5-3.6 2.4.7 4.4 2.6 5.1 5-1.8-1-4-1-5.8 0-2 1.1-3.1 3.4-2.7 5.6-3.4-.5-5.8-3.4-5.7-6.7z" opacity=".95"/></svg>
              </span>
            </div>
            <div class="taskbar-tray">
              <span class="tray-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5a11.5 11.5 0 0 1 16 0M7 15a7.3 7.3 0 0 1 10 0m-6.7 3.4a2.5 2.5 0 0 1 3.4 0" fill="none" stroke="#27313b" stroke-width="1.8" stroke-linecap="round"/></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h3l5 4V5L8 9zm10.2 1.3a3.2 3.2 0 0 1 0 3.4m2.4-5.8a7 7 0 0 1 0 8.2" fill="none" stroke="#27313b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="16" height="10" rx="2" fill="none" stroke="#27313b" stroke-width="1.7"/><path d="M20 10v4" stroke="#27313b" stroke-width="1.7" stroke-linecap="round"/><rect x="5.5" y="9.5" width="10" height="5" rx="1" fill="#27313b"/></svg>
              </span>
              <span class="taskbar-clock">10:45<br>9/11/2026</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hinge" aria-hidden="true"></div>
      <div class="base" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
