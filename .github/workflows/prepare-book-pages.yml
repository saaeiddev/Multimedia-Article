name: Prepare book pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  render:
    if: ${{ !hashFiles('book-pages/.ready') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PDF pages as images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p book-pages
          pdftoppm -jpeg -r 110 -jpegopt quality=88 'multimedia farsi - ویراستاری علمی.pdf' book-pages/page
          touch book-pages/.ready
      - name: Commit rendered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book-pages
          git commit -m 'Render Persian book pages for reliable online reading' || exit 0
          git push
